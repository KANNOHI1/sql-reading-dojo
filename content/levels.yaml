  can: "クエリを「書かれた順」ではなく「実行される順」で読める。FROM から目で追い始められる"
- id: L1
  rank: 語彙
  title: 基本の 6 語
  summary: FROM / SELECT / WHERE / NULL / ORDER BY / LIMIT / DISTINCT
